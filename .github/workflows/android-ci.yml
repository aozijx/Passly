name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Android app
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Run architecture and Android quality gates
        shell: bash
        run: >-
          ./gradlew verifyArchitecture
          :app:compileDebugKotlin
          :domain:test
          :runtime:session:test
          :core:testDebugUnitTest
          :core:common:test
          :data:testDebugUnitTest
          :security:testDebugUnitTest
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleDebug
          :app:assembleDebugAndroidTest
          --no-daemon
          --no-parallel
          --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx4g -Xms512m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
          -Dkotlin.daemon.jvmargs="-Xmx2g -Xms256m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
          --stacktrace
