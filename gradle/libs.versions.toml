[versions]
# 构建与工具 (Build & Tooling)
# Kotlin 版本决定了 KSP 和 Compose Compiler 的兼容范围
agp = "9.0.1"
kotlin = "2.3.20"
# ❗ KSP 版本 2.3.x 系列不再使用 xxx-1.0.x 后缀，直接写三段数字
ksp = "2.3.9"
# Hilt 版本建议与 hilt-navigation-compose 保持库兼容性
hilt = "2.59.2"

# Android 核心 (Android Core)
coreKtx = "1.18.0"
appcompat = "1.7.1"
coreSplashscreen = "1.2.0"
palette = "1.0.0"

# 生命周期与架构 (Lifecycle & Architecture)
lifecycleRuntimeKtx = "2.10.0"
lifecycleProcess = "2.10.0"
# Navigation 通常随 Compose 或 Lifecycle 更新，建议保持较新以修复兼容性问题
navigationCompose = "2.9.7"
# ❗ Hilt 导航适配器，版本通常落后于 Hilt 主库，升级 Hilt 后需检查此库是否报错
hilt-navigation-compose = "1.2.0"

# Jetpack Compose & UI
# Compose BOM 决定了大部分 ui-* 库的版本，手动指定版本时需注意不被 BOM 覆盖
composeBom = "2026.03.00"
activityCompose = "1.13.0"
foundation = "1.10.6"
materialIcons = "1.7.8"

# 数据持久化 (Data Storage)
# ❗ Room 使用 KSP 时，对 Kotlin 版本非常敏感
room = "2.8.4"
paging = "3.3.6"
datastorePreferences = "1.2.1"
# ❗ 序列化库版本建议与 Kotlin 版本保持兼容性检查
kotlinxSerializationJson = "1.11.0"
# ❗ SQLCipher 是 SQLite 的加密层，升级其中之一需确保 native 库不冲突
sqlite = "2.7.0"
sqlcipher = "4.17.0"
uuidCreator = "6.1.1"

# 凭据管理器 / 自动填充 (Credentials & Autofill)
credentials = "1.6.0"
autofill = "1.3.0"

# 安全与加密 (Security & Auth)
biometric = "1.4.0-alpha07"
argon2kt = "1.6.0"

# 媒体与多媒体 (Media & Utilities)
coil = "2.7.0"
markdown-renderer = "0.41.0"

# 相机与扫码 (Camera & Barcode)
barcodeScanningBundled = "17.3.0"
# ❗ CameraX 内部组件版本必须完全一致（core, camera2, lifecycle, view）
cameraxVersion = "1.6.1"
zxing = "3.5.4"

# 测试 (Testing)
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"

[libraries]
# Android 核心
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
androidx-palette = { group = "androidx.palette", name = "palette", version.ref = "palette" }

# 生命周期与架构
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycleProcess" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hilt-navigation-compose" }

# Jetpack Compose & UI
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "foundation" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core", version.ref = "materialIcons" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "materialIcons" }

# 依赖注入 (Hilt)
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-android-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }

# 数据持久化 (Room & DataStore & Serialization)
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
androidx-room-paging = { group = "androidx.room", name = "room-paging", version.ref = "room" }
androidx-paging-compose = { group = "androidx.paging", name = "paging-compose", version.ref = "paging" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastorePreferences" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
androidx-sqlite = { module = "androidx.sqlite:sqlite", version.ref = "sqlite" }
sqlcipher = { module = "net.zetetic:sqlcipher-android", version.ref = "sqlcipher" }
uuid-creator = { module = "com.github.f4b6a3:uuid-creator", version.ref = "uuidCreator" }

# 凭据管理器 / 自动填充 (Credentials & Autofill)
# Android 14+ 系统凭据框架，支持 Passkey 和统一账号选择器
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
# 对接 Google Play Services 认证，实现云端 Passkey 同步与旧版系统兼容
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
# 低版本 Android (<14) 自动填充框架兼容库
androidx-autofill = { group = "androidx.autofill", name = "autofill", version.ref = "autofill" }

# 安全与加密
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
argon2kt = { module = "com.lambdapioneer.argon2kt:argon2kt", version.ref = "argon2kt" }

# 媒体与多媒体
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
coil-gif = { module = "io.coil-kt:coil-gif", version.ref = "coil" }
coil-svg = { module = "io.coil-kt:coil-svg", version.ref = "coil" }
markdown-renderer = { module = "com.mikepenz:multiplatform-markdown-renderer-m3", version.ref = "markdown-renderer" }

# 相机与扫码
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "cameraxVersion" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "cameraxVersion" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "cameraxVersion" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "cameraxVersion" }
barcode-scanning = { module = "com.google.mlkit:barcode-scanning", version.ref = "barcodeScanningBundled" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

# 测试相关
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
androidx-room = { id = "androidx.room", version.ref = "room" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }