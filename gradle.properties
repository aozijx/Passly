# Local development on a 16-core / 32-thread, 16 GB machine.
# Prefer build throughput; leave enough headroom for Android Studio, Kotlin, KSP, R8, and emulator.
org.gradle.jvmargs=-Xmx7g -Xms1g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g -Xms512m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.workers.max=12
org.gradle.warning.mode=fail

# Enable daemon and parallel build for local
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=true
org.gradle.welcome=never

# KSP optimization
ksp.incremental=true

# Android settings
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Enable configuration cache to skip the configuration phase on subsequent builds
org.gradle.configuration-cache=true
# Warn on problems instead of failing (easier to debug)
org.gradle.configuration-cache.problems=warn
